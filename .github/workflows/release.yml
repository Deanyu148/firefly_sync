name: Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build plugin
        run: pnpm run build

      - name: Run tests
        run: pnpm test

      - name: Package portable zip
        run: |
          mkdir -p build/firefly-sync
          cp main.js manifest.json styles.css LICENSE README.md build/firefly-sync/
          if [ -f versions.json ]; then
            cp versions.json build/firefly-sync/
          fi
          cd build
          zip -r ../firefly-sync.zip firefly-sync/
          cd ..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            main.js
            manifest.json
            styles.css
            firefly-sync.zip
