name: CI & Release

on:
  push:
    branches:
      - main
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
  pull_request:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate tag format (if tagged)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${{ github.ref_name }}"
          if ! [[ "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Error: Tag '$TAG' is not in decimal x.x.x format (without 'v')."
            exit 1
          fi
          echo "Release version: $TAG"

      - name: Sync version to plugin manifests (if tagged)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          node -e '
            const fs = require("fs");
            const tag = process.env.TAG;

            // manifest.json
            const manifest = JSON.parse(fs.readFileSync("manifest.json", "utf8"));
            manifest.version = tag;
            fs.writeFileSync("manifest.json", JSON.stringify(manifest, null, 2) + "\n");

            // package.json
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            pkg.version = tag;
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n");

            // versions.json
            let versions = {};
            try {
              versions = JSON.parse(fs.readFileSync("versions.json", "utf8"));
            } catch {}
            versions[tag] = manifest.minAppVersion || "1.7.2";
            fs.writeFileSync("versions.json", JSON.stringify(versions, null, 2) + "\n");
          '
        env:
          TAG: ${{ github.ref_name }}

      - name: Commit & push updated manifests back to repository (if tagged)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add manifest.json package.json versions.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): bump repository files version to ${{ github.ref_name }} [skip ci]"
            git push origin HEAD:main
          fi

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build plugin
        run: pnpm run build

      - name: Run tests
        run: pnpm test

      - name: Generate artifact attestations
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            main.js
            manifest.json
            styles.css
